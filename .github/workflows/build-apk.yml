name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'src/**'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'capacitor.config.*'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK (runner preinstalled)
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Runner 未提供预装 Android SDK（ANDROID_HOME 为空）"
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail

          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list_installed | grep -E 'platforms;android|build-tools;' || true

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck + unit tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Build web assets
        run: npm run build

      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Enforce offline (strip INTERNET permission)
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/android\.permission\.INTERNET/d' "$MANIFEST"
          fi
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "::error::无法移除 AndroidManifest.xml 中的 INTERNET 权限"
            exit 1
          fi
          echo "OK: 源清单不含 INTERNET 权限"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify offline (merged manifest)
        run: |
          set -euo pipefail
          MERGED=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*merged*' -print -quit)
          if [ -z "$MERGED" ]; then
            echo "::error::未找到合并后的 AndroidManifest.xml"
            exit 1
          fi
          echo "checking $MERGED"
          if grep -q 'android.permission.INTERNET' "$MERGED"; then
            echo "::error::合并清单包含 INTERNET 权限，禁止发布离线 APK"
            exit 1
          fi
          echo "OK: 合并清单未声明 INTERNET 权限"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mahjong3D-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mahjong3D-debug
          path: Mahjong3D-debug.apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Mahjong3D Debug Build
          prerelease: true
          files: Mahjong3D-debug.apk
          body: |
            离线版 3D 麻将 APK（无 INTERNET 权限）。
            每次成功构建都会更新本 Release 的附件。