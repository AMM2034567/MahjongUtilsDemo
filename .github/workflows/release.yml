name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "MahjongUtilsDemo-${TAG}-debug.apk"

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: MahjongUtilsDemo ${{ github.ref_name }}
          files: MahjongUtilsDemo-${{ github.ref_name }}-debug.apk
          body: |
            ## 项目介绍

            MahjongUtilsDemo 是一个纯本地运行的麻将工具 Android 应用，基于 Kotlin + Jetpack Compose 构建。

            ## 核心功能

            - **向听计算**：计算手牌的向听数
            - **和牌判断**：判断手牌是否满足和牌条件
            - **点数计算**：计算胡牌后的番数与点数
            - **切牌评分**：对每张可切牌进行评分建议

            ## 说明

            该 APK **无网络权限**，纯本地离线运行，所有计算均在设备端完成。

            ## 安装

            下载附件中的 `MahjongUtilsDemo-${{ github.ref_name }}-debug.apk` 并安装即可。